name: ClickUp Teams Report

on:
  schedule:
    - cron: '23 2 * * 1-5'  # ~9:23 sáng giờ VN (UTC+7), Thứ 2 - Thứ 6 (lệch giờ tròn để tránh bị GitHub delay)
    - cron: '47 8 * * 1-5'  # ~15:47 chiều giờ VN (UTC+7), Thứ 2 - Thứ 6 (lệch giờ tròn để tránh bị GitHub delay)
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chạy báo cáo
        run: node src/index.js
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TEAMS_FLOW_URL_1: ${{ secrets.TEAMS_FLOW_URL_1 }}
          TEAMS_FLOW_URL_2: ${{ secrets.TEAMS_FLOW_URL_2 }}
          TEAMS_FLOW_URL_3: ${{ secrets.TEAMS_FLOW_URL_3 }}
          TEAMS_FLOW_URL_4: ${{ secrets.TEAMS_FLOW_URL_4 }}
