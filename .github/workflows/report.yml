name: ClickUp Teams Report

on:
  schedule:
    - cron: '30 2 * * 1-5'  # 9:30 sáng giờ VN (UTC+7), Thứ 2 - Thứ 6
    - cron: '0 9 * * 1-5'   # 16:00 chiều giờ VN (UTC+7), Thứ 2 - Thứ 6
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chạy báo cáo
        run: node src/index.js
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TEAMS_FLOW_URL_1: ${{ secrets.TEAMS_FLOW_URL_1 }}
          TEAMS_FLOW_URL_2: ${{ secrets.TEAMS_FLOW_URL_2 }}
          TEAMS_FLOW_URL_3: ${{ secrets.TEAMS_FLOW_URL_3 }}
          TEAMS_FLOW_URL_4: ${{ secrets.TEAMS_FLOW_URL_4 }}
